amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0   # nav2 기본값. 로봇 크기와 무관한 값이라 2배로 올릴 이유가 없었음
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # AMCL 은 띄워두되 결과(map->odom TF)는 쓰지 않는다. 위치는 launch 의 ground_truth_localization 이
    # Isaac 실제 자세로 잡는다 (시뮬 odom 은 drift 가 없어서 보정할 것이 없다).
    # AMCL 로 되돌리려면: tf_broadcast: true, set_initial_pose: true + initial_pose 기입(또는 RViz 2D Pose Estimate),
    # 그리고 launch 에서 ground_truth_localization 노드를 뺀다.
    tf_broadcast: false
    # map->odom 을 마지막 스캔 처리 후 이 시간만큼 유효하게 유지한다. Isaac Sim 라이다가 1.2초까지 끊기는데
    # 1.0 이면 그 사이 TF 가 만료되어 controller_server 가 "Transform data too old" 로 주행을 abort 한다.
    transform_tolerance: 3.0
    update_min_a: 0.2
    update_min_d: 0.2   # 자주·조금씩 보정 → map->odom 점프 완화
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
      
velocity_smoother: 
  ros__parameters: 
    use_sim_time: True
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP"   # CLOSED_LOOP 는 램프가 이론값(0.60s)의 3.3배(2.00s) 로 늘어져 최종 회전이 좌우로 헌팅함 (실측)
    max_velocity: [0.5, 0.0, 0.5] 
    min_velocity: [-0.3, 0.0, -0.5] 
    # deadband_velocity: [0.0, 0.0, 0.0] 
    velocity_timeout: 1.0 
    max_accel: [0.5, 0.0, 1.0]     # 기본값(2.5/3.2)은 390kg 로봇에 공격적
    max_decel: [-0.5, 0.0, -1.0] 
    odom_topic: "chassis/odom" 
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25   # 목표 근처 미세 정렬 구간이 실패로 잡히지 않게
      movement_time_allowance: 15.0   # NavFn 경로는 코너마다 제자리 회전(180도 ≈ 8초)
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 도킹 정밀도. 경로 전체를 FollowPath 로 보내므로 이 값은 경로 끝(도킹 지점)에만 적용된다.
      # DWB 로 실질적으로 맞출 수 있는 하한 (xy 0.05 / yaw 0.03). 더 줄이려면 도킹 구간 컨트롤러를 바꿔야 한다.
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.03   # 1.7도
  # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0   # NavFn 은 후진 경로를 만들지 않음
      min_vel_y: 0.0
      max_vel_x: 0.5   # 사람이 있는 공간 주행 속도
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.5   # max_vel_x 와 정합
      min_speed_theta: 0.0
      acc_lim_x: 1.0   # 급출발 억제
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.5   # 감속은 상대적으로 강하게 (안전)
      decel_lim_y: 0.0
      decel_lim_theta: -3.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.1
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # RotateToGoal 이 '제자리 회전 모드'로 바뀌는 창. goal checker 의 xy_goal_tolerance 보다 크면
      # 그 창에 들어오자마자 전진을 멈춰서 checker 허용치까지 못 다가가므로 반드시 같거나 작게 둔다.
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05   # 5cm/s 이하여야 최종 회전 시작 (사람 공간 주행 고려)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.5   # 사람 공간: 장애물에서 떨어지려는 성향 부여
      PathAlign.scale: 8.0   # 직선 구간 미세 조향 추가 완화 (32 -> 16 -> 8)
      PathAlign.forward_point_distance: 0.8   # 로봇 길이 1.86m 기준 (기존 0.1 은 1배 카터용)
      GoalAlign.scale: 12.0   # PathAlign(8.0) 과 균형
      GoalAlign.forward_point_distance: 0.8   # 〃
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
        

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 책상까지 여유가 5cm 뿐이라 이 이상은 파지 자세가 충돌 판정된다
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      mark_threshold: 2
      always_send_full_costmap: True
      plugins: ["front_3d_lidar_layer", "front_2d_lidar_layer", "back_2d_lidar_layer", "inflation_layer", "static_map_layer"]
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0   # 거리에 따라 빠르게 감쇠 (붉은 띠 좁아짐)
        inflation_radius: 0.6      # 내접 반경 0.48 + 여유 0.12
        
      front_2d_lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /front_2d_lidar/scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
      back_2d_lidar_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /back_2d_lidar/scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"

      front_3d_lidar_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        voxel_decay: 15.0 # seconds if linear, e^n if exponential
        decay_model: 0 # 0=linear, 1=exponential, -1=persistent
        voxel_size: 0.1 # meters
        track_unknown_space: False # default space is known
        mark_threshold: 2 # voxel height
        update_footprint_enabled: true
        combination_method: 1 # 1=max, 0=override
        origin_z: 0.0 # meters
        publish_voxel_map: true # default off
        transform_tolerance: 0.2 # seconds
        # observation_sources: hesai_mark hesai_clear
        observation_sources: hesai_mark
        hesai_mark:
          data_type: PointCloud2
          topic: /front_3d_lidar/lidar_points
          marking: true
          clearing: false
          obstacle_range: 6.0 # meters
          min_obstacle_height: -0.8 # default 0, meters
          max_obstacle_height: 3.0 # default 3, meters
          expected_update_rate: 0.0 # default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 # default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false # default false, for laser scans
          filter: "voxel" # default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommend on     voxel_min_points: 0          # default 0, minimum points per voxel for voxel filter
          clear_after_reading: true # default false, clear the buffer after the layer gets readings from it
        # hesai_clear:
        #   enabled: true #default true, can be toggled on/off with associated service call
        #   data_type: PointCloud2
        #   topic: /front_3d_lidar/lidar_points
        #   marking: false
        #   clearing: true
        #   max_z: 20.0 # default 0, meters
        #   min_z: 0.05 # default 10, meters
        #   vertical_fov_angle: 1.15 # Note: This the full fov.
        #   vertical_fov_padding: 0.05 # 3D Lidar only. Default 0, in meters
        #   horizontal_fov_angle: 6.29 # 3D lidar scanners like the VLP16 have 360 deg horizontal FOV.
        #   decay_acceleration: 5.0 # default 0, 1/s^2.
        #   model_type: 1 # default 0, model type for frustum. 0=depth camera, 1=3d lidar like VLP16 or similar

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 〃
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      # rolling_window: True
      # width: 200
      # height: 200
      resolution: 0.05
      # origin_x: -100.0
      # origin_y: -100.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # 차선 선호 마스크 (maps/lane_mask.png, make_lane_mask.py 로 생성). 차선 밖은 비용 40% 라
      # planner 가 평소엔 ㄷ자 동선 가운데로 가고, 사람이 막으면 비용을 감수하고 벗어나 우회한다.
      # 로컬 코스트맵에는 넣지 않는다 (컨트롤러가 차선 밖 회피를 꺼리게 되면 안 되므로).
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: True
        filter_info_topic: "/costmap_filter_info"
        transform_tolerance: 0.1
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 0.15 는 감쇠가 거의 없어 맵 전체가 고비용이었다
        # Smac Hybrid 가 footprint(꼬리 포함) 로 충돌 검사를 하려면 로봇 외접 반경(1.48 m) 이상이어야 한다.
        # 0.6 이면 검사가 무력화되어 책상 옆을 스치거나 모서리에 걸리는 경로가 나온다. 로컬 코스트맵(DWB)은 0.6 유지.
        inflation_radius: 1.6
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    # Isaac Sim 라이다(/scan ~4.5Hz)가 주기적으로 1.0~1.2초씩 끊긴다. 1.0 이면 그때마다 로봇을 세운다.
    source_timeout: 2.5
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6000000000
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.3
      max_height: 4.0
      enabled: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "intergration_nova.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac Hybrid-A*: 최소 회전 반경 제약으로 직선+호 경로를 만든다 (자동차처럼 도는 움직임).
      # 이전에 "가까운 목표에서 고리를 그리다 실패"했던 건 followWaypoints 로 가까운 목표를 여러 개 준
      # 구성에서였다. 지금은 먼 staging 지점 하나만 목표로 주고, 도킹/탈출 직진은 FollowPath 가 맡는다.
      plugin: "nav2_smac_planner::SmacPlannerHybrid"
      tolerance: 0.25
      downsample_costmap: true       # 1001x1001@0.05 는 Hybrid-A* 에 무거워서 0.1 m 로 탐색
      downsampling_factor: 2
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "DUBIN"   # 전진만 (min_vel_x 0). REEDS_SHEPP 는 후진 호를 만든다
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.6   # 서쪽 포켓 U턴이 가능한 최소값 (move_test.py 의 고정 경로와 동일)
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0             # 차선 마스크/인플레이션 비용을 피해 차선 가운데로
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5   # 주행 max_vel_theta 와 일치 (복구가 더 거칠면 안 됨)
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0   # 주행 acc_lim_theta 와 일치

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
