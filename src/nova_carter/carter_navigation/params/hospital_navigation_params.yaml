# 병원 사람 회피 전용 파라미터. 기존 carter 설정에서 분리하여 검증한다.
amcl:
  ros__parameters:
    use_sim_time: True
    # Isaac /chassis/odom 은 물리 엔진 자세 기반이라 누적 오차가 거의 없다. 0.2(이동량의 20%)는 파티클을
    # 크게 퍼뜨려 주행 중 AMCL 이 0.35 m / 9 deg 까지 끌려갔다. 같은 주행 bag 재생 비교(정답=시작자세+odom):
    # 0.2 -> 최대 0.352 m / 9.3 deg, 0.02 -> 최대 0.168 m / 1.5 deg.
    alpha1: 0.02
    alpha2: 0.02
    alpha3: 0.02
    alpha4: 0.02
    alpha5: 0.02
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0   # nav2 기본값. 로봇 크기와 무관한 값이라 2배로 올릴 이유가 없었음
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    # Isaac start_pose.json 은 초기 위치에만 사용한다. 이후 map->odom 은 AMCL 이 단독 발행한다.
    tf_broadcast: true
    # map->odom 을 마지막 스캔 처리 후 이 시간만큼 유효하게 유지한다. Isaac Sim 라이다가 1.2초까지 끊기는데
    # 1.0 이면 그 사이 TF 가 만료되어 controller_server 가 "Transform data too old" 로 주행을 abort 한다.
    transform_tolerance: 3.0
    update_min_a: 0.2
    update_min_d: 0.2   # 자주·조금씩 보정 → map->odom 점프 완화
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    # 긴 Carter 차체가 원본 /scan 에 찍히므로 위치 추정에는 차체 반사 제거 스캔을 사용한다.
    scan_topic: scan_body_filtered
    map_topic: map
    set_initial_pose: false
    always_reset_initial_pose: false
    first_map_only: false

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
      
velocity_smoother: 
  ros__parameters: 
    use_sim_time: True
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP"   # CLOSED_LOOP 는 램프가 이론값(0.60s)의 3.3배(2.00s) 로 늘어져 최종 회전이 좌우로 헌팅함 (실측)
    # DWB/MPPI 공통 각속도 상한 0.9. 긴 후방의 쓸림을 줄이고 일찍 회피한다.
    max_velocity: [0.8, 0.0, 0.9]
    min_velocity: [-0.3, 0.0, -0.9]
    # deadband_velocity: [0.0, 0.0, 0.0] 
    velocity_timeout: 1.0 
    max_accel: [0.5, 0.0, 1.5]     # 기본값(2.5/3.2)은 390kg 로봇에 공격적. 직진 가속은 유지, 각가속만 상향
    max_decel: [-0.6, 0.0, -1.5] 
    odom_topic: "chassis/odom" 
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 6.0  # 일시적인 회피 궤적 부재 시 정지하며 다시 최적화
    progress_checker_plugins: ["progress_checker"]
    # 경로 구간은 Nav2, 마지막 테이블 옆 직선은 hospital_docking이 제어한다.
    # 모든 턴은 DWB, 복도 중앙 직선만 MPPI. hospital_mission이 선택한다.
    goal_checker_plugins: ["general_goal_checker", "transit_goal_checker"]
    controller_plugins: ["FollowPath", "FollowPathDock", "FollowPathMPPI"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      # PoseProgressChecker는 목표점에서의 제자리 회전도 정상 진행으로 인정한다.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25   # 목표 근처 미세 정렬 구간이 실패로 잡히지 않게
      required_movement_angle: 0.10    # 약 5.7도 회전하면 진행 타이머를 갱신
      # 보행자가 차선을 횡단하는 동안 정지해도 즉시 실패하지 않고 MPPI가
      # 회피하거나 통과 후 원 경로로 복귀할 시간을 준다.
      movement_time_allowance: 45.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::StoppedGoalChecker"
      # 좌표 5cm는 유지. 다음 레인의 접선 방향을 유지하되 도킹 수준의
      # 1.7도 미세 정렬 대신 5.7도 허용으로 불필요한 끝점 회전을 줄인다.
      xy_goal_tolerance: 0.05
      yaw_goal_tolerance: 0.10   # 5.7도; lab -90도 / specimen +90도
      trans_stopped_velocity: 0.03
      rot_stopped_velocity: 0.05
    transit_goal_checker:
      # 구간 경계용. 실제 시험에서 사람 옆에서 yaw 17도 수렴을 기다리며 18초 정체했다.
      # 최종 정류장 자세는 general에서 유지하고, 컨트롤러 전환점만 0.8rad로 완화한다.
      stateful: False
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.8
  # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0   # NavFn 은 후진 경로를 만들지 않음
      min_vel_y: 0.0
      max_vel_x: 0.8   # 0.5 -> 0.8. 도킹은 GoalDist 가 sim_time(1.7 s)*v 앞에서 자연 감속시키므로 그대로 두되, 5 cm 를 놓치면 0.6 으로 되돌릴 것
      max_vel_y: 0.0
      max_vel_theta: 0.9   # R=0.6 U턴에서 속도가 0.3 으로 떨어지지 않게 (0.5/0.6=0.83 필요). 직진 0.5 는 도킹 정밀도 때문에 유지
      min_speed_xy: 0.0
      max_speed_xy: 0.8   # max_vel_x 와 정합
      min_speed_theta: 0.0
      acc_lim_x: 1.0   # 급출발 억제
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.5   # 감속은 상대적으로 강하게 (안전)
      decel_lim_y: 0.0
      decel_lim_theta: -3.5
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.1
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # RotateToGoal 이 '제자리 회전 모드'로 바뀌는 창. goal checker 의 xy_goal_tolerance 보다 크면
      # 그 창에 들어오자마자 전진을 멈춰서 checker 허용치까지 못 다가가므로 반드시 같거나 작게 둔다.
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05   # 5cm/s 이하여야 최종 회전 시작 (사람 공간 주행 고려)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.5  # 긴 후방을 포함한 polygon 충돌 검사
      PathAlign.scale: 8.0   # 직선 구간 미세 조향 추가 완화 (32 -> 16 -> 8)
      PathAlign.forward_point_distance: 0.8   # 로봇 길이 1.86m 기준 (기존 0.1 은 1배 카터용)
      GoalAlign.scale: 12.0   # PathAlign(8.0) 과 균형
      GoalAlign.forward_point_distance: 0.8   # 〃
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

    # 도킹 구간(③) 전용 DWB. FollowPath 와 같은 critic/파라미터, 속도만 0.5 (도킹 정밀도 5 cm 확보)
    FollowPathDock:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0   # NavFn 은 후진 경로를 만들지 않음
      min_vel_y: 0.0
      # 정류장 도착 구간 전용. 사용자 지정 상한 0.5; 목표 근처 감속은 제어기가 수행.
      max_vel_x: 0.5  # 사용자 지정 도착 상한. 극저속 구간을 추가하지 않는다.
      max_vel_y: 0.0
      max_vel_theta: 0.6   # 0.9 -> 0.6: 도착 정렬에서 과회전(오버슈트) 방지. 원호는 transit 쪽 DWB 가 담당한다
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.0   # 급출발 억제
      acc_lim_y: 0.0
      acc_lim_theta: 1.0   # 각가속도 낮춰 정렬을 부드럽게
      decel_lim_x: -1.5   # 감속은 상대적으로 강하게 (안전)
      decel_lim_y: 0.0
      decel_lim_theta: -2.0   # 과회전 후 되돌아오는 진동 완화
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7
      linear_granularity: 0.1
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # RotateToGoal 이 '제자리 회전 모드'로 바뀌는 창. goal checker 의 xy_goal_tolerance 보다 크면
      # 그 창에 들어오자마자 전진을 멈춰서 checker 허용치까지 못 다가가므로 반드시 같거나 작게 둔다.
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.05   # 5cm/s 이하여야 최종 회전 시작 (사람 공간 주행 고려)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.5
      PathAlign.scale: 8.0   # 직선 구간 미세 조향 추가 완화 (32 -> 16 -> 8)
      PathAlign.forward_point_distance: 0.8   # 로봇 길이 1.86m 기준 (기존 0.1 은 1배 카터용)
      GoalAlign.scale: 12.0   # PathAlign(8.0) 과 균형
      GoalAlign.forward_point_distance: 0.8   # 〃
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

  # MPPI parameters (복도 전용). 정적/동적 장애물이 있을 때 경로 주변으로 부드럽게 우회했다가 돌아오게 한다.
  # 경로는 복도 동쪽(x=8.0)에 치우쳐 그려서 서쪽 4 m 가 회피 공간이 된다.
    FollowPathMPPI:
      plugin: "nav2_mppi_controller::MPPIController"
      # 예측 horizon = time_steps * model_dt. 고정 경로(FollowPath) 위의 장애물을 MPPI 혼자 비켜 가려면
      # "옆으로 빠졌다가 지나가는" 궤적 전체가 horizon 안에 들어와야 한다. 2.8 s 로는 콘 앞 0.6 m 에서야 알아채고
      # 제자리에 서 버렸다(실측) -> 4.5 s. 연산량이 비례해서 늘므로 controller 20 Hz 를 놓치면(로그 'missed its desired rate') 줄인다.
      time_steps: 90
      model_dt: 0.05          # 90 * 0.05 = 4.5 s 앞을 본다 (0.5 m/s 면 2.25 m)
      batch_size: 1000
      # 과거 낮은 가속도 설정에서 속도 정체가 보고되어 기존 값을 임시 유지한다.
      # Jazzy motion model은 첫 단계뿐 아니라 예측 단계 전체에 ax/az를 적용한다.
      # 따라서 실제 출력단과 불일치가 남는다. GPU에서 검증할 정합화 후보:
      # ax_max=0.5, ax_min=-0.6, az_max=1.5 (일괄 적용 금지, 속도 정체 원인 확인 후).
      # 새 외부 guard의 예측은 smoother의 0.5/-0.6/1.5를 사용한다.
      ax_max: 30.0
      ax_min: -30.0
      ay_max: 0.0
      ay_min: 0.0
      az_max: 20.0
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.2             # 기본 0.4. 회전 노이즈가 크면 (1) 출력 wz 가 흔들려 좌우 1~2 cm 요동, (2) 빠른 샘플일수록
                              # 옆으로 새서 PathAlign 벌점이 커져 속도가 0.2 m/s 근처에 묶인다 (실측 0.17)
      vx_max: 0.6             # 보행자 시험: 제동 여유를 확보한 초기 상한
      vx_min: 0.0             # 후진 금지. 꼬리 1.38 m 가 라이다 사각에서 벽/사람에 닿는다
      vy_max: 0.0
      wz_max: 0.9             # 꼬리 쓸림 감소. 선제 측방 경로 선택으로 대응 시간을 확보.
      iteration_count: 1
      prune_distance: 5.0     # critic 에 주는 경로 길이 (horizon 4.5 s * 0.8 = 3.6 m 보다 길게). horizon 거리보다 길어야 장애물 너머의 경로점이 보여 PathFollow 가 그쪽으로 당긴다
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      # 후보 1000개 시각화는 제어에 필요 없고 Isaac+RViz 동시 실행 시 큰 부하다.
      # 궤적 디버깅할 때만 true로 일시 변경한다.
      visualize: false
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        # 장애물 회피의 핵심. 로봇이 길어 내접원(0.48) 대신 footprint 전체로 충돌 검사한다.
        # 실측(2026-09-22 자유보행): 접촉 3초 전부터 예측점 10/11 개가 경로 위(전방 0.7~3.4 m)에 있었고
        # 로봇 앞 1 m 비용이 raw ~239 였는데도 0.53~0.60 m/s 직진 -> 접촉(-0.44 m).
        # 240 은 inscribed(253) 미만이라 critical 로 안 세고, 가중치 5 가 PathFollow 8 / PathAlign 8 에 밀린 것.
        # 5 -> 25 로 올려 "예측/인플레이션 위를 지나가는 것" 이 경로 이탈보다 확실히 비싸게 만든다.
        enabled: true
        cost_power: 1
        cost_weight: 25.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.0  # MPPI 구간 끝에서도 사람 soft 비용 선호를 유지
        trajectory_point_step: 1
      PathAlignCritic:
        # 경로 위 점의 5% 이상이 장애물에 가려지면 자동으로 꺼져서(max_path_occupancy_ratio) 우회를 허용한다.
        # 가중치는 기본 14 -> 8. 이 critic 은 후보 궤적이 1 m(offset_from_furthest 20 포즈) 이상 뻗을 때만 켜져서
        # 빠른 샘플에만 벌점을 주므로, PathFollow 보다 세면 속도 상한처럼 작용한다.
        # 8 -> 4: 사람을 비켜 갈 때의 횡이탈 비용을 낮춘다 (복귀는 PathFollow 가 담당).
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        # 전진 속도를 만드는 유일한 critic (궤적 끝이 경로 앞쪽 목표점에 가까울수록 보상). 기본 5 -> 8.
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 12   # 권장치 = horizon 거리의 30% / 경로 간격 = 4.5*0.5/0.05/3 ≈ 15
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 책상까지 여유가 5cm 뿐이라 이 이상은 파지 자세가 충돌 판정된다
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      mark_threshold: 2
      always_send_full_costmap: True
      # 순서가 곧 덮어쓰기 순서다 (static 먼저, inflation 마지막). 원본은 static 이 맨 뒤여서 라이다 마크가 전부 지워졌었다.
      # 동적 장애물 레이어는 2D ObstacleLayer(/scan) 하나만 쓴다:
      #  - 3D VoxelLayer(포인트클라우드) 는 레이캐스트가 3D 라, 라이다(0.9 m) 보다 높은 사람 상체 복셀(1.0~1.8 m) 을
      #    지우려면 먼 벽으로 가는 광선이 그 칸을 정확히 지나야 해서 잘 안 지워진다 -> 사람이 지나간 자리에 잔상이 남아
      #    MPPI 가 "Optimizer fail" / "Failed to make progress" 로 멈췄다 (실측 2회).
      #  - /scan 은 pointcloud_to_laserscan 이 z 0.1~3.9 m 를 한 줄로 눌러 만든 LaserScan 이라 빔마다 맞은 점까지의 칸을
      #    통째로 지운다 (높이 개념이 없어 잔상이 안 남는다). 글로벌 costmap 이 이 방식이고 사람이 깨끗하게 지워지는 걸 확인했다.
      plugins: ["static_map_layer", "scan_layer", "prediction_layer", "inflation_layer"]
      prediction_layer:
        plugin: "hospital_dynamic_layer::PredictionLayer"
        enabled: true
        topic: <robot_namespace>/hospital/predicted_obstacles   # launch 가 <robot_namespace> 를 "" 또는 /robotN 으로 바꾼다
        timeout: 1.2   # Isaac GUI 라이다 간격 최대 ~1.2 s. 짧으면 예측 비용이 깜빡인다
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0   # 거리에 따라 빠르게 감쇠 (붉은 띠 좁아짐)
        # 현재 정류장은 도킹 지점이 아니다. 긴 로봇의 외접반경 1.481m를
        # 포함하는 비용장을 MPPI에 제공한다. 실제 사람 간격은 audit으로 검증.
        inflation_radius: 1.6

      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan                 # launch 의 pointcloud_to_laserscan (3D 라이다 -> 360deg LaserScan, z 0.1~3.9 m)
          data_type: "LaserScan"
          marking: True
          clearing: True
          obstacle_max_range: 6.0      # 6 m 앞부터 찍는다 (MPPI 가 감속/우회할 시간)
          obstacle_min_range: 0.0
          raytrace_max_range: 8.0      # 지우는 거리는 찍는 거리보다 커야 3~6 m 잔상이 안 남는다
          raytrace_min_range: 0.0
          inf_is_valid: True           # 맞은 게 없는 빔(inf) 도 그 방향을 raytrace_max_range 까지 지운다
          max_obstacle_height: 4.0
          min_obstacle_height: 0.0
          expected_update_rate: 0.0
          observation_persistence: 0.0

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 〃
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      # rolling_window: True
      # width: 200
      # height: 200
      resolution: 0.05
      # origin_x: -100.0
      # origin_y: -100.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: <robot_namespace>/scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 20.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 0.15 는 감쇠가 거의 없어 맵 전체가 고비용이었다
        inflation_radius: 1.0      # 플래너(우회 경로) 전용. 사람에서 1 m 떨어진 우회선이 나오게. 도킹은 로컬 costmap/DWB 라 무관
      always_send_full_costmap: True
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    # velocity_smoother -> hospital_velocity_guard(예측 사람 감속) -> collision_monitor
    cmd_vel_in_topic: "cmd_vel_human_checked"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    # 자기 반사 제거 후 입력이 끊기면 정지. Isaac GUI 실행 시 /scan 은 평균 3 Hz, 간격 0.1~1.2 s(실측)라
    # 0.6 이면 수시로 'invalid source' 정지 -> 가감속 반복이 생겼다.
    source_timeout: 1.2
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    # 실측 근거(2026-09-22 자유보행 시험): 횡단 보행자가 5 m -> 1 m 로 다가오는 3 초 동안
    # MPPI 명령이 0.53~0.60 m/s 로 유지됐고, 1 m 에서야 조향을 시작했다가 모든 궤적이 막혀
    # "Optimizer fail to compute path" 후 정지 — 이미 접촉(-0.44 m) 한 뒤였다.
    # 정적 costmap 은 "아직 경로 위에 없는" 횡단자를 표현하지 못하므로, 컨트롤러와 무관하게
    # 전방에 사람이 있으면 먼저 속도를 낮춰 판단/회피 시간을 번다 (감속 -> 접근 속도 감소 -> horizon 여유).
    polygons: ["SlowdownFront", "FootprintApproach"]
    SlowdownFront:
      type: "polygon"
      # base_link 기준 전방 3.5 m, 좌우 +-0.6 m (로봇 반폭 0.5 + 0.1). 꼬리(-1.38) 는 포함하지 않는다.
      # +-1.1 이면 15 cm 옆 책상(로봇 중심에서 0.65 m)이 항상 들어와 도킹/출발이 0.4배로 묶였다.
      # 옆에서 들어오는 사람은 FootprintApproach 와 hospital_velocity_guard 가 맡는다.
      points: "[[3.5, 0.6], [3.5, -0.6], [0.48, -0.6], [0.48, 0.6]]"
      action_type: "slowdown"
      slowdown_ratio: 0.4       # 0.6 m/s -> 0.24 m/s. 사람 1.1 m/s 와의 접근 속도가 1.7 -> 1.34 m/s
      min_points: 4             # 스캔 4점 이상 (사람 폭이면 충분, 노이즈 1~2점은 무시)
      visualize: True
      enabled: True
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan_body_filtered"
      min_height: 0.3
      max_height: 4.0
      enabled: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "intergration_nova.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 차동구동이라 제자리 회전이 가능한데, Smac Hybrid 는 곡률 제약(최소 회전반경) 때문에
      # 항상 큰 호로 돌고 가까운 목표에서 고리를 그리다 실패했다 -> 격자 A* 인 NavFn 으로 복귀.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.9   # 주행 max_vel_theta 와 일치 (복구가 더 거칠면 안 됨)
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5   # 주행 acc_lim_theta 와 일치

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200
