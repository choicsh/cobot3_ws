# 사람 회피 실험 전용. carter_navigation_params.yaml 의 복사본이며 아래 두 곳만 다르다.
#
#   bt_navigator.default_nav_through_poses_bt_xml   추가 (경유지 되돌아가기 수정)
#   FollowPath.forward_prune_distance               3.0 (기본 2.0). sim_time 과 함께 순항 속도를 정한다
#   global_costmap.inflation_layer                  radius 0.6->1.2, scaling 3.0->1.5
#   FollowPath.ObstacleFootprint.scale              0.2 -> 0.05 (좁은 곳 회전 허용)
#   LaserScan 소스 3곳 inf_is_valid                  true (지나간 사람 마킹이 지워지도록)
#   local_costmap VoxelLayer -> STVL + ObstacleLayer  시간 감쇠 voxel_decay 5.0
#   global obstacle_max_range                        20 -> 5 (잔상 누적 차단)
#
# 원본이 갱신되면 이 파일도 다시 복사해서 두 곳을 재적용할 것.
# nav2_human_test.launch.py 의 params_file 기본값이 이 파일이다.

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0   # nav2 기본값. 로봇 크기와 무관한 값이라 2배로 올릴 이유가 없었음
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 360
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.2   # 자주·조금씩 보정 → map->odom 점프 완화
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 1.233      # 씬의 chassis_link(=base_link) 실측 위치
      y: 3.363
      z: 0.0
      yaw: 3.14159  # 180도

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # navigate_to_pose 는 기본 BT 를 그대로 쓴다.
    # navigate_through_poses 만 교체한다. RemovePassedGoals 가 경유지를 못 지워
    # 로봇이 되돌아가는 현상 때문이다. 바뀐 값과 근거는 XML 머리 주석 참고.
    #
    # install 이 아니라 src 경로를 가리킨다. BT 를 고칠 때마다 colcon build 를 다시
    # 하지 않아도 되고, 지금 단계에서는 radius 를 여러 번 만질 가능성이 높다.
    default_nav_through_poses_bt_xml: "/home/rokey/cobot3_ws/src/nova_carter/carter_navigation/behavior_trees/nav_through_poses_human_test.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
      
velocity_smoother: 
  ros__parameters: 
    use_sim_time: True
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP"   # CLOSED_LOOP 는 램프가 이론값(0.60s)의 3.3배(2.00s) 로 늘어져 최종 회전이 좌우로 헌팅함 (실측)
    max_velocity: [1.5, 0.0, 0.5]   # x 이력: 0.5 -> 0.7 -> 1.5. FollowPath max_vel_x 와 같아야 한다 (낮으면 여기서 잘린다)
    min_velocity: [-0.3, 0.0, -0.5]
    # deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # x 이력: 0.5 -> 2.0. 속도와 같이 올려 정지거리를 유지한다 (정지거리 = v^2/2a).
    # 단계적으로 낮출 때 쓸 조합 — 속도/가감속/정지거리 순:
    #   1.5 / 2.0 / 0.56m   <- 현재    1.2 / 1.5 / 0.48m    1.0 / 1.0 / 0.50m    0.7 / 0.5 / 0.49m
    # **FollowPath 의 acc_lim_x / decel_lim_x 와 반드시 같이 바꿀 것** (어긋나면 도킹 오버슈트)
    # 회전축(1.0/-1.0)은 안 건드린다 — sim_time 과 곱해지는 궤적 스윕이 커져 좁은 통로에서 걸러진다
    max_accel: [2.0, 0.0, 1.0]     # Nav2 기본값 2.5/3.2 는 390kg 로봇에 공격적 — 2.0 은 그 바로 아래
    max_decel: [-2.0, 0.0, -1.0]
    odom_topic: "chassis/odom" 
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /chassis/odom   # 기본값 /odom 은 이 씬에 없음. StoppedGoalChecker 정지 판정과 DWB 현재 속도가 이 토픽에서 온다
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25   # 목표 근처 미세 정렬 구간이 실패로 잡히지 않게
      movement_time_allowance: 30.0   # 제자리 정렬 중엔 병진이 0 이라 progress_checker 가 무조건 실패로 집계. 회전 추종률 실측 0.5x 라 정렬에 2배 소요
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      # StoppedGoalChecker 는 SimpleGoalChecker 상속 + "정지했는가" 조건 추가.
      # Simple 은 움직이는 중에도 SUCCEEDED 를 내서, 그 뒤 감속 구간(390kg 관성)이 제어 밖에서 밀렸다.
      plugin: "nav2_controller::StoppedGoalChecker"
      xy_goal_tolerance: 0.1     # 차동구동 한계상 실질 하한 0.05
      yaw_goal_tolerance: 0.05   # 2.9도. AMCL 각도 추정 오차가 하한(~0.03)
      trans_stopped_velocity: 0.03   # 3cm/s 이하여야 도착 인정 (시뮬 속도 잡음 고려해 0.02 대신)
      rot_stopped_velocity: 0.03     # 1.7도/s 이하여야 도착 인정. 미세 떨림으로 늦어지면 0.05 로 완화
  # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: 0.0   # NavFn 은 후진 경로를 만들지 않음
      min_vel_y: 0.0
      # 이력: 0.5 -> 0.7 -> 1.5. 감속도를 0.5 -> 2.0 으로 같이 올려 정지거리는 0.49m -> 0.56m 로
      # 거의 유지된다. 원래 0.5 는 "사람이 있는 공간 주행 속도"로 고른 값이니, 사람과 마주치는
      # 구간이나 WP5 부근 좁은 통로(통과폭 0.90m)에서 문제가 나면 여기부터 낮출 것
      max_vel_x: 1.5
      max_vel_y: 0.0
      max_vel_theta: 0.5   # 회전은 안 올린다 (sim_time 1.7 과 곱해지는 궤적 스윕 문제)
      min_speed_xy: 0.0
      max_speed_xy: 1.5   # max_vel_x 와 정합
      min_speed_theta: 0.0
      # 아래 4개는 velocity_smoother 의 max_accel/max_decel 과 반드시 같아야 한다.
      # 달랐을 때: DWB 는 0.5m/s 를 8cm 만에 세울 수 있다고 계산하지만 smoother 가 0.5m/s^2 로 묶어
      # 실제로는 25cm 를 더 밀려간다 (min_vel_x=0.0 이라 후진 복귀도 불가) -> 도킹 지점 오버슈트.
      acc_lim_x: 2.0   # = velocity_smoother max_accel[0]. 이력: 0.5 -> 2.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.0   # = velocity_smoother max_accel[2]
      decel_lim_x: -2.0   # = velocity_smoother max_decel[0]. 이력: -0.5 -> -2.0
      decel_lim_y: 0.0
      decel_lim_theta: -1.0   # = velocity_smoother max_decel[2]
      vx_samples: 20
      vy_samples: 5
      vtheta_samples: 20
      sim_time: 1.7   # 원본 값. 3.0 으로 올려 봤다가 되돌렸다.
                      # 3.0 이면 제자리 회전 궤적이 max_vel_theta 0.5 x 3.0 = 86도를 쓸어가므로
                      # 좁은 통로에서 빠른 회전 후보가 전부 풋프린트 충돌로 걸러진다.
                      # 1.7 은 이 프로젝트가 이미 검증한 값이고, 3.0 은 미검증이었다.
                      # 사람 회피가 약하면(0.5m/s x 1.7s = 0.85m 앞만 봄) 넓은 구간에서
                      # 이 값만 따로 실험할 것. 좁은 통로 통과와 섞으면 판정이 안 된다.
      linear_granularity: 0.1
      angular_granularity: 0.025
      transform_tolerance: 0.2
      # DWB 에 넘기는 전역 경로 길이. 기본값 2.0 은 90도 코너에서 정점 너머까지 보여준다.
      # GoalDist critic 이 "경로 위에서 로봇으로부터 가장 먼 점"을 겨냥하므로, 코너 너머가 보이면
      # 그쪽으로 질러가려는 힘이 생겨 코너를 크게 깎는다.
      # 실측: WP2(90도 코너)를 0.76m 밖으로 지나쳐 RemovePassedGoals(radius 0.7)가 못 지웠고,
      #       경로가 되돌아가도록 재생성돼 로봇이 정지했다.
      #       실효 회전반경 1.83m — 운동학적 최소(v/w = 0.5/0.5 = 1.00m)의 1.8배였다.
      # 1.0 으로 줄이면 코너 너머가 안 보여 코너를 돈 뒤에 다음 구간을 본다.
      # params 에 없던 항목이라 기존 튜닝값은 하나도 건드리지 않는다.
      # DWB 가 점수를 매길 때 보는 전역 경로를 로봇 앞 이만큼까지만 자른다. 이 값이 sim_time 과
      # 묶여서 실제 순항 속도를 정한다 — v ~ forward_prune_distance / sim_time.
      # 1.0 이면 1.0/1.7 = 0.59 m/s 가 자연 속도라, max_vel_x 를 1.5 로 올려도 0.55 밖에 안 나왔다
      # (실측: /cmd_vel_nav 0.55). 3.0 이면 3.0/1.7 = 1.76 이라 max_vel_x 가 실제 상한이 된다.
      # 이력: 1.0 -> 3.0. 원래 1.0 은 코너 과대 선회 억제용이었다(기본 2.0) — 코너 절삭이
      # 심해지면 2.0 으로 내릴 것. 런타임 시험: ros2 param set /controller_server 로 바로 바뀐다
      forward_prune_distance: 3.0
      xy_goal_tolerance: 0.1
      trans_stopped_velocity: 0.05   # 5cm/s 이하여야 최종 회전 시작 (사람 공간 주행 고려)
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.05   # 0.5 -> 0.2 -> 0.05. 같은 이유로 한 번 더 내렸다.
      # 0.5 일 때 하늘색(253) 감점 6.3 이 GoalAlign(2.0) 보다 커서 회전을 체계적으로 억제했다.
      # 하늘색은 내접반경 0.48m 띠일 뿐 실제 충돌이 아니다. 치명(254) 거부는 scale 과 무관하게 유지된다.
      # (dwb_critics/obstacle_footprint.cpp 의 pointCost: LETHAL_OBSTACLE(254) 와
      #  NO_INFORMATION(255) 만 throw 하고, 253 은 예외 없이 return cost 로 점수만 된다)
      #
      # 0.2 로도 부족했던 이유 — base_link 가 풋프린트 중심이 아니라서다.
      #   풋프린트 x -1.38~0.48 -> 제자리 회전 스윕 반경 = base_link~(-1.38,0.5) = 1.468 m
      #   253 띠(내접 0.48m)를 안 건드리려면 여유 반경 1.468 + 0.48 = 1.95 m 필요
      #   undock 종료 지점 (-1.75, 3.38) 의 실제 여유 반경은 1.82 m -> 회전 중 253 진입 불가피
      # 물리적 회전 자체는 1.468 m 면 되므로 가능하다(여유 0.35 m). 막고 있던 건 감점뿐이었다.
      Oscillation.oscillation_reset_time: 5.0   # 기본 -1.0 은 시간 해제 끔. 막혀서 못 움직이면 해제조건(5cm/11.5도)을
      # 영영 못 채워 잠금이 영구화되고 419개 전부 불법이 됐다 (실측 불법판정 89,000건)
      # 내접 반경 0.48 m (footprint 앞변 거리) 안에 들어가면 실제 충돌 여부와 무관하게 제자리 회전까지 막혔다.
      # 차체 실측 1.80 x 0.988 m 로 footprint(1.86 x 1.0) 여유가 전후 3cm/좌우 6mm 뿐이라 footprint 축소는 불가.
      PathAlign.scale: 8.0   # 직선 구간 미세 조향 추가 완화 (32 -> 16 -> 8)
      PathAlign.forward_point_distance: 0.8   # 로봇 길이 1.86m 기준 (기존 0.1 은 1배 카터용)
      GoalAlign.scale: 3.0   # 목표 0.09m 앞에서 GoalAlign 기여 8.1 이 RotateToGoal 0.8 을 압도해 좌우 반전 진동 유발 (측정). 최종 정렬은 RotateToGoal 담당
      GoalAlign.forward_point_distance: 0.8   # 〃
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
        

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 책상까지 여유가 5cm 뿐이라 이 이상은 파지 자세가 충돌 판정된다
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      mark_threshold: 2
      always_send_full_costmap: False   # 240x240=57,600 셀 전체 대신 증분 발행. RViz 표시는 동일
      # StaticLayer 가 뒤에 오면 updateWithTrueOverwrite 로 팽창을 통째로 덮어씀 (실측: 팽창 cost 0개).
      # static 은 맨 앞, inflation 은 맨 뒤를 반드시 유지할 것.
      # front_3d_lidar_layer(VoxelLayer) -> stvl_layer + rear_scan_layer 로 분리했다.
      # STVL 저자가 "평면 라이다에는 쓰지 말라"고 명시해서 2D 인 /scan_rear 는 ObstacleLayer 로 남긴다.
      plugins: ["static_map_layer", "stvl_layer", "rear_scan_layer", "inflation_layer"]
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0   # 거리에 따라 빠르게 감쇠 (붉은 띠 좁아짐)
        inflation_radius: 0.6      # 내접 반경 0.48 + 여유 0.12
        
      # 주의: 아래 이름들은 nav2_costmap_2d::VoxelLayer 가 선언하는 이름과 정확히 일치해야 한다.
      # ros2 param list /local_costmap/local_costmap 로 확인 가능. 이름이 틀리면 조용히 무시된다.
      # 시간 감쇠 레이어. raytrace clearing 은 "지금 광선이 통과한 셀"만 지우므로,
      # 관측이 끊긴 자리(로봇 뒤로 빠진 곳, 사람에 가렸던 그림자)는 영원히 안 지워진다.
      # STVL 은 마킹에 수명을 줘서 광선이 안 지나가도 시간이 지나면 사라지게 한다.
      # 파라미터 이름이 VoxelLayer 와 다르다 (obstacle_max_range -> obstacle_range 등).
      # 값은 패키지가 제공하는 example/vlp16_config.yaml 을 기준으로 잡았다.
      # VLP16 이 +-15도 3D 라이다라 XT-32 (elevationDeg -15~+15) 와 사양이 같다.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0             # 초. 관측이 끊긴 마킹이 5초 뒤 사라진다  <- 핵심 값
        decay_model: 0               # 0=선형, 1=지수, -1=영구
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true   # VoxelLayer 의 footprint_clearing_enabled 에 해당
        combination_method: 1        # 1=max
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        # 같은 토픽을 마킹용과 클리어링용으로 두 벌 선언한다. STVL 의 구조다.
        observation_sources: front_mark front_clear
        front_mark:
          data_type: PointCloud2
          topic: /front_3d_lidar/lidar_points
          marking: true
          clearing: false
          obstacle_range: 6.0        # 기존 obstacle_max_range 6.0 과 같은 의도
          # 바닥 컷. nav2 ObservationBuffer 가 클라우드를 전역 프레임으로 변환한 뒤 넘기므로
          # 이 값은 바닥 기준 높이다.
          # 이전 VoxelLayer 도 -0.8 이었지만 바닥이 안 찍혔던 건 다른 두 장치 덕분이었다:
          #   (1) z_voxels 10 x z_resolution 0.2 -> 복셀 그리드가 z=0~2.0m 에만 존재
          #   (2) mark_threshold 2 -> 기둥에 복셀 2개(0.4m) 이상 있어야 장애물. 바닥은 한 층이라 탈락
          # STVL 은 OpenVDB 라 z 상한이 없고 mark_threshold 0 이라 둘 다 사라졌다 -> 바닥이 통째로 찍혔다.
          min_obstacle_height: 0.1   # -0.8 에서. 바닥면 위 10cm 부터만 장애물로 친다
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "voxel"            # vlp16 예제 기준. 3D 라이다는 점이 많아 voxel 필터 권장
          voxel_min_points: 0
          clear_after_reading: true
        front_clear:
          enabled: true
          data_type: PointCloud2
          topic: /front_3d_lidar/lidar_points
          marking: false
          clearing: true
          min_z: 0.1                 # front_mark 의 min_obstacle_height 와 맞출 것.
                                     # 어긋나면 바닥 근처에서 지우기/찍기가 불일치한다
          max_z: 6.0                 # obstacle_range 와 맞춤
          vertical_fov_angle: 0.5236 # XT-32 수직 FOV 30도 (robot_nova.usd 의 elevationDeg -15~+15 실측)
          vertical_fov_padding: 0.05 # 3D 라이다 전용
          horizontal_fov_angle: 6.2832  # 360도
          decay_acceleration: 5.0
          model_type: 1              # 1 = 3D 라이다 (모래시계형 FOV). 0 은 깊이 카메라

      # 후방 2D 라이다. STVL 이 평면 라이다를 지원하지 않아 ObstacleLayer 로 따로 둔다.
      # 설정은 기존 front_3d_lidar_layer 의 scan_rear 소스를 그대로 옮긴 것이다.
      rear_scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan_rear
        scan_rear:
          data_type: LaserScan
          topic: /scan_rear
          marking: true
          clearing: true
          obstacle_max_range: 6.0    # 로컬은 12x12m 롤링 윈도우다
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.8
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          # pointcloud_to_laserscan 이 use_inf: True 라 미검출 광선은 inf 로 온다.
          # false 로 두면 그 광선을 버려 아무것도 지우지 않는다.
          inf_is_valid: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 〃
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      # rolling_window: True
      # width: 200
      # height: 200
      resolution: 0.05
      # origin_x: -100.0
      # origin_y: -100.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 후방 2D 라이다가 자기 차체를 본다 (실측). 센서가 base_link 기준 x=-0.613 로 footprint
        # (x -1.38~0.48) 한가운데 있어서, 스캔에 footprint 경계까지의 거리가 그대로 찍힌다:
        #   뒤 모서리 0.916m / 앞 변 1.093m / 앞 모서리 1.202m  <- 실측 클러스터와 일치
        # ObstacleLayer 의 기본값은 false 라 이 점들이 영구 장애물로 남아 로봇을 따라다닌다.
        # local_costmap 의 VoxelLayer 는 이미 true 로 켜져 있었다.
        footprint_clearing_enabled: true
        # scan      = 전방. /front_3d_lidar/lidar_points 를 pointcloud_to_laserscan 이 변환
        # scan_rear = 후방 2D RPLidar(SLAMTEC S2E). Isaac 액션그래프가 LaserScan 을 직접 발행하므로
        #             변환 노드가 없다. 자세한 배선은 run_human_scene.py 의 ensure_rear_lidar_graph 참고.
        observation_sources: scan scan_rear
        scan:
          topic: /scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          # 찍는 건 5m 이내만, 지우는 건 20m 까지.
          # 전역 costmap 은 시간 감쇠가 없다(소스가 LaserScan 2개뿐이라 STVL 을 못 쓴다).
          # 그래서 한 번 찍힌 마킹은 광선이 그 셀을 다시 통과해야만 지워진다.
          # 사거리 20m 로 멀리까지 찍으면 로봇이 다시 볼 일 없는 곳에 잔상이 영구히 쌓인다.
          # raytrace_max_range 는 20m 로 남겨 지우는 능력은 그대로 둔다.
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          # pointcloud_to_laserscan 이 use_inf: True 라 미검출 광선은 inf 로 온다.
          # nav2 ObstacleLayer 는 이 값에 따라 콜백이 갈린다:
          #   false -> inf 광선을 버린다. 아무것도 지우지 않는다
          #   true  -> inf 를 range_max - epsilon 으로 바꿔 raytrace_max_range 까지 비운다
          # "거기 아무것도 없다"는 가장 강한 정보를 false 로 두면 통째로 버리게 된다.
          # 사람이 지나간 자리가 안 지워지고 영구 장애물로 남던 원인.
          inf_is_valid: true
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # RPLidar S2E 실측 사거리는 30m 지만, 전방 scan 과 같은 20m 로 맞춘다.
          # 마킹 범위보다 해제 범위가 작으면 마크가 안 지워진다.
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0   # 위 scan 과 같은 이유
          obstacle_min_range: 0.0
          inf_is_valid: true        # 위 scan 과 같은 이유
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 전역만 키운다. local 의 0.6 은 DWB ObstacleFootprint 판정과 엮여 있고
        # "내접 반경 0.48m 안에 들면 제자리 회전까지 막혔다"는 실측 이력이 있어 건드리지 않는다.
        #
        # NavFn 은 비용 가중치 파라미터가 없다 (tolerance/use_astar/allow_unknown/
        # use_final_approach_orientation 뿐. COST_NEUTRAL 50, COST_FACTOR 0.8 은 컴파일 상수).
        # 따라서 경로를 장애물에서 밀어내는 수단은 costmap 비용 자체를 키우는 것뿐이다.
        #
        # 0.6 은 내접 반경 0.48 + 0.12 로 "겨우 안 닿는" 값이라, 사람에게서 0.6m 만 떨어져도
        # 비용이 0 이 되어 NavFn 이 그 경계에 딱 붙는다. 그런데 차체는 base_link 기준
        # 뒤로 1.38m / 앞으로 0.48m 라, 중심이 0.6m 떨어져도 차체는 사람 코앞이다.
        # 팽창 비용은 치명(254)이 아니라 선호도이므로 키워도 통행 불가가 되지는 않는다.
        cost_scaling_factor: 1.5   # 3.0 은 감쇠가 빨라 비용 띠가 좁았다. 낮추면 먼 거리까지 비용 유지
        inflation_radius: 1.2      # 0.6 -> 1.2. radius 와 scaling 은 같이 조절해야 의미가 있다
      always_send_full_costmap: False   # 1001x1001=100만 셀을 매초 직렬화하던 것을 증분으로. RViz 표시는 동일
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6000000000
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.3
      max_height: 4.0
      enabled: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "intergration_nova.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 차동구동이라 제자리 회전이 가능한데, Smac Hybrid 는 곡률 제약(최소 회전반경) 때문에
      # 항상 큰 호로 돌고 가까운 목표에서 고리를 그리다 실패했다 -> 격자 A* 인 NavFn 으로 복귀.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10   # goal checker 의 xy_goal_tolerance(0.10) 와 일치. 0.25 면 NavFn 이 목표에서 25cm 못 미쳐 끝내도 되는데 성공 판정은 10cm 라 영원히 도달 불가
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5   # 주행 max_vel_theta 와 일치 (복구가 더 거칠면 안 됨)
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0   # 주행 acc_lim_theta 와 일치

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

