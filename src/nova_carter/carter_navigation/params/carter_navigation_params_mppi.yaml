# MPPI 시험용. carter_navigation_params_human_test.yaml 의 복사본이며 아래 세 곳만 다르다.
#
#   controller_server.FollowPath        DWB -> RotationShim + MPPI (블록 통째 교체)
#                                       RotationShim 이 필요한 이유는 그 블록 주석 참고
#   local_costmap.inflation_layer       inflation_radius 0.6 -> 1.55 (외접 반경 하한)
#   general_goal_checker.yaw_goal_tolerance  3.15 -> 0.05 (최종 정렬을 Nav2 가 한다)
#
# ⚠ 마지막 항목은 주행 미션 스크립트와 짝이다. Nav2 가 정렬하려면
#   through_pose_human_test.py 를 --nav2-align 으로 실행해야 한다 (그 플래그가 없으면
#   스크립트가 마지막 경유지 0.5 m 앞에서 Nav2 를 취소해 정렬 단계까지 가지도 않는다).
#
# 그 외는 전부 동일하다. 한 번에 한 변수만 바꿔야 판정이 되기 때문이다 —
# amcl / costmap 레이어 / global inflation / velocity_smoother / collision_monitor /
# general_goal_checker / BT XML(hz 2.0, radius 0.7) 는 손대지 않았다.
# through_pose_human_test.py 도 무변경이다 (컨트롤러 플러그인에 의존하는 곳이 없다).
#
# 실행 — 이 파일은 install/ 이 아니라 src 절대경로로 직접 넘긴다. colcon build 불필요.
#   ros2 launch carter_navigation nav2_human_test.launch.py \
#     params_file:=/home/rokey/cobot3_ws/src/nova_carter/carter_navigation/params/carter_navigation_params_mppi.yaml
# DWB 로 되돌리려면 params_file 인자를 빼고 실행하면 된다.
#
# 원본(human_test)이 갱신되면 이 파일도 다시 복사해서 위 두 곳을 재적용할 것.

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0   # nav2 기본값. 로봇 크기와 무관한 값이라 2배로 올릴 이유가 없었음
    laser_max_range: 100.0
    # -1.0(스캔 자체 값) -> 0.7 (2026-09-23). 로봇 자기 몸 반사를 AMCL 에서만 버린다.
    # 실측 (scan_self_check, 정지 상태 100 스캔, 723 빔):
    #   후방 +-120~180도 호에 고정 반사 111개 (15.4%), 거리 0.393~0.518 m. 라이다 뒤 랙/상부구조다.
    #   max_beams 60 으로 균등 추출하면 60개 중 9.2개가 여기에 낭비된다.
    # 고정 반사는 모든 파티클에 같은 감점을 주므로 위치 튐의 원인은 아니다 (구별에 기여 안 함).
    # 이 값의 효과는 낭비되던 유효 빔 9개를 되찾는 것이지 튐 해결이 아니다.
    # 0.7 = 측정 최대 0.518 + 여유 0.18. 더 올리면 진짜 벽 반환까지 버린다.
    # nav2_amcl 은 이 값 이하 반환을 range_max 로 치환하고, likelihood_field 는
    # range_max 이상을 continue 로 건너뛴다 -> 그 빔은 "정보 없음" 이 된다.
    # 영향 범위는 AMCL 뿐이다. /scan 자체는 그대로라 costmap / collision_monitor 는 무관하다.
    laser_min_range: 0.7
    laser_model_type: "likelihood_field"
    # 360 -> 60 (nav2 기본값, 2026-09-23). 주행 중 위치가 이산적으로 튀는 현상 대책.
    # likelihood_field 는 빔마다 나온 확률을 곱한다 — 빔이 서로 독립이라는 가정인데,
    # 인접 라이다 빔은 같은 벽을 보므로 전혀 독립이 아니다. 빔을 6배로 쓰면 사후분포가
    # 그만큼 뾰족해져 파티클 구름이 한 점으로 붕괴하고, 작은 모델 오차에도 다른 최빈값으로
    # 통째로 건너뛴다 (점진적으로 밀리는 게 아니라 이산적으로 도약하는 게 이 증상의 특징).
    # 여기서 고르는 빔 수는 /scan 전체(angle_increment 0.0087 -> 약 722개)에서 균등 추출한다.
    # 결과: **이것만으로는 튐이 안 잡혔다 (실측).** 되돌리지는 않았다 — 60 이 nav2 기본값이고
    # 과신을 줄이는 방향 자체는 맞기 때문이다. 튐의 원인은 따로 남아 있다.
    # 남은 후보 (한 번에 하나씩 볼 것):
    #   (a) /scan 이 3D 라이다를 -0.8~3.0m 두께로 누른 것. p2l 은 각 각도 빈에서 최소 거리를
    #       고르므로 침대·책상·사람이 2D 맵에 없는 가짜 벽으로 들어간다. 주행 중 어떤 물체가
    #       빈을 차지하는지가 불연속으로 바뀌는 게 "주행 중에만 튄다" 와 맞아떨어진다.
    #       대책은 AMCL 전용 /scan 을 얇은 높이 띠로 따로 뽑는 것 (런치에 p2l 노드 1개 추가).
    #   (b) alpha1~5 0.2 가 Isaac 오도메트리에 과하다. 매 스텝 파티클을 크게 흩뿌려 놓고
    #       뾰족한 우도로 다시 모으는 "퍼졌다 -> 스냅" 이 반복된다.
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 3
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.2   # 자주·조금씩 보정 → map->odom 점프 완화
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      # 씬의 /World/robot_nova 실측 위치. 이력: 1.233/3.363/180도 -> 현재
      # (2026-09-23, 병원 맵 교체 — East_DockDesk 앞).
      # through_pose_human_test.py 의 INIT_POSE 와 **반드시 같은 값**이어야 한다.
      x: 20.270
      y: 13.745
      z: 0.0
      yaw: 1.5708   # 90도

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # navigate_to_pose 는 기본 BT 를 그대로 쓴다.
    # navigate_through_poses 만 교체한다. RemovePassedGoals 가 경유지를 못 지워
    # 로봇이 되돌아가는 현상 때문이다. 바뀐 값과 근거는 XML 머리 주석 참고.
    #
    # install 이 아니라 src 경로를 가리킨다. BT 를 고칠 때마다 colcon build 를 다시
    # 하지 않아도 되고, 지금 단계에서는 radius 를 여러 번 만질 가능성이 높다.
    default_nav_through_poses_bt_xml: "/home/rokey/cobot3_ws/src/nova_carter/carter_navigation/behavior_trees/nav_through_poses_human_test.xml"

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

docking_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
      
velocity_smoother: 
  ros__parameters: 
    use_sim_time: True
    smoothing_frequency: 20.0 
    scale_velocities: false 
    feedback: "OPEN_LOOP"   # CLOSED_LOOP 는 램프가 이론값(0.60s)의 3.3배(2.00s) 로 늘어져 최종 회전이 좌우로 헌팅함 (실측)
    max_velocity: [1.5, 0.0, 0.5]   # x 이력: 0.5 -> 0.7 -> 1.5. FollowPath max_vel_x 와 같아야 한다 (낮으면 여기서 잘린다)
    min_velocity: [-0.3, 0.0, -0.5]
    # deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    # x 이력: 0.5 -> 2.0. 속도와 같이 올려 정지거리를 유지한다 (정지거리 = v^2/2a).
    # 단계적으로 낮출 때 쓸 조합 — 속도/가감속/정지거리 순:
    #   1.5 / 2.0 / 0.56m   <- 현재    1.2 / 1.5 / 0.48m    1.0 / 1.0 / 0.50m    0.7 / 0.5 / 0.49m
    # **FollowPath 의 acc_lim_x / decel_lim_x 와 반드시 같이 바꿀 것** (어긋나면 도킹 오버슈트)
    # 회전축(1.0/-1.0)은 안 건드린다 — sim_time 과 곱해지는 궤적 스윕이 커져 좁은 통로에서 걸러진다
    max_accel: [2.0, 0.0, 1.0]     # Nav2 기본값 2.5/3.2 는 390kg 로봇에 공격적 — 2.0 은 그 바로 아래
    max_decel: [-2.0, 0.0, -1.0]
    odom_topic: "chassis/odom" 
    odom_duration: 0.1

controller_server:
  ros__parameters:
    use_sim_time: True
    odom_topic: /chassis/odom   # 기본값 /odom 은 이 씬에 없음. StoppedGoalChecker 정지 판정과 DWB 현재 속도가 이 토픽에서 온다
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25   # 목표 근처 미세 정렬 구간이 실패로 잡히지 않게
      movement_time_allowance: 30.0   # 제자리 정렬 중엔 병진이 0 이라 progress_checker 가 무조건 실패로 집계. 회전 추종률 실측 0.5x 라 정렬에 2배 소요
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      # StoppedGoalChecker 는 SimpleGoalChecker 상속 + "정지했는가" 조건 추가.
      # Simple 은 움직이는 중에도 SUCCEEDED 를 내서, 그 뒤 감속 구간(390kg 관성)이 제어 밖에서 밀렸다.
      plugin: "nav2_controller::StoppedGoalChecker"
      # 0.1 -> 0.05 로 줄였다가 **원복했다** (2026-09-23). 0.05 는 쓰면 안 된다.
      # 이유: DWB RotateToGoal 은 FollowPath.xy_goal_tolerance(감속 창) 안에서 속도가
      #       trans_stopped_velocity 아래로 떨어지면 병진 명령 자체를 불법 처리한다
      #       ("Nonrotation command near goal"). 그 창이 이 값보다 넓으면 그 사이 구간은
      #       **전진은 금지됐는데 성공 판정은 안 나오는 사각지대**가 된다.
      #       로봇이 거기 멈추면 못 빠져나오고 progress_checker 30초 뒤 복구로 빠진다.
      # 이 값은 FollowPath.xy_goal_tolerance 보다 작으면 안 된다.
      # 그리고 애초에 0.05 가 필요 없다 — do_dock() 이 정지 위치에서 도킹점까지의
      # 축 방향 투영을 다시 재서 전진하므로 앞뒤 오차는 흡수된다. 도킹에 영향을 주는
      # 횡방향 오차는 이 tolerance 가 아니라 경로 추종 정확도와 AMCL 이 정한다.
      # planner_server 의 GridBased.tolerance 와 **항상 같이 움직일 것**.
      xy_goal_tolerance: 0.1
      # ★ 3.15 -> 0.05 로 되돌렸다 (2026-09-23, 사용자 지시). 원래 프로젝트 값이 0.05 였다.
      # DWB 설정(human_test.yaml)에서 3.15 로 푼 이유는 **전부 DWB critic 병리**였다:
      #   "목표 근처 정렬에서 좌우 반전 진동" = GoalAlign(8.1) vs RotateToGoal(0.8) 경합
      #   "먼 쪽으로 한 바퀴 회전"            = 같은 critic 조합
      # MPPI 에는 RotateToGoal / GoalAlign critic 자체가 없고, 최종 회전은
      # RotationShimController 의 rotate_to_goal_heading 이 제자리 회전으로 처리한다.
      # 그래서 그 이유가 이 파일에는 적용되지 않는다.
      # 0.05 = 2.9도. AMCL 각도 추정 오차(~0.03 rad)가 실질 하한이다.
      # 주의: general_goal_checker 는 navigate_to_pose 도 함께 쓴다 (그쪽도 이제 방향을 본다).
      yaw_goal_tolerance: 0.05
      trans_stopped_velocity: 0.03   # 3cm/s 이하여야 도착 인정 (시뮬 속도 잡음 고려해 0.02 대신)
      rot_stopped_velocity: 0.03     # 1.7도/s 이하여야 도착 인정. 미세 떨림으로 늦어지면 0.05 로 완화
  # DWB parameters
    FollowPath:
      # DWB -> MPPI. 근거는 Nav2 Tuning Guide 의 메인테이너 권고
      # ("highly recommended to go this route") 와, 실제 출하 설정이 전부 MPPI 라는 점이다:
      #   nav2_bringup 1.3.13 기본값, clearpath_nav2_demos 9개 기종 전부 (Jackal ~ Warthog).
      #
      # 아래 값은 clearpath_nav2_demos jazzy 의 w200(Warthog, 1.52x1.38m, 280kg) 설정을
      # 기준으로 하고, 이 로봇의 속도/가감속/각속도만 현재 DWB 설정과 같게 맞췄다.
      # Warthog 를 고른 이유는 공개된 출하 설정 중 제원이 가장 가깝기 때문이다
      # (이 로봇은 1.86x1.00m, 390kg).
      # --- RotationShim (MPPI 앞단). 경로 시작 방위가 크게 다르면 제자리 회전부터 시킨다 ---
      # 왜 필요한가 (2026-09-23 실측):
      #   UNDOCK 종료 자세 yaw +90도 -> lower_lane WP1 방위 -149.7도 = 제자리 회전 120.3도.
      #   그런데 MPPI 의 예측 지평은 time_steps 56 x model_dt 0.05 = 2.8초이고,
      #   이 로봇의 wz_max 는 0.5 라 그 안에서 쓸어낼 수 있는 각도가 0.5 x 2.8 = 80.2도뿐이다.
      #   목표 방위가 지평 밖이면 2000개 샘플이 전부 "여전히 안 맞음"으로 끝나 비용이 평평해지고
      #   최적해가 안 잡힌다. (Warthog 원본은 wz_max 1.9 라 같은 지평에서 304.8도를 쓸었다 —
      #    지평 56x0.05 는 그 각속도를 전제로 잡힌 값이었는데 그걸 모르고 그대로 복사했다.)
      #
      # Nav2 Tuning Guide 가 이 증상에 지정한 해법이다:
      #   "awkward, stuttering, or whipping around behavior when your robot's initial and
      #    path heading's are significantly divergent" / "most optimally for ... differential"
      # 지평이나 wz_max 를 건드리지 않고 회전 구간만 떼어내므로 MPPI 튜닝이 그대로 산다.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785      # 45도. 이보다 크게 틀어지면 제자리 회전부터
      angular_disengage_threshold: 0.3925  # 22.5도까지 좁히면 MPPI 에 넘긴다
      forward_sampling_distance: 0.5     # 경로 위 이 거리의 점을 겨냥해 목표 방위를 잡는다
      # 기본값 1.8 / 3.2 를 쓰면 안 된다 — velocity_smoother.max_velocity[2] 가 0.5 라
      # 거기서 잘린다. Nav2 쪽 상한과 맞춘다 (스크립트 StraightDriver.TURN_MAX_W 와도 같은 값).
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0             # = az_max / velocity_smoother.max_accel[2]
      max_cost_threshold: 254.0
      simulate_ahead_time: 1.0
      # ★ true 로 켰다가 **되돌렸다** (2026-09-23). 이 로봇에서는 쓰면 안 된다.
      # 실측 교착 (마지막 경유지에서 무한 제자리 회전, /cmd_vel_nav = v 0.0 / w -0.5 고정):
      #   x=-45.141 yaw -52.98deg  목표까지 0.322 m   <- 책상면까지 0.250 m, 차체와 겹침
      #   x=-44.800 yaw -11.60deg  목표까지 0.080 m
      #   41도 도는 동안 base_link 가 0.34 m 이동했다.
      # 원인: 이 파라미터는 **병진을 0 으로 두고 회전만** 한다. 그런데 base_link 가 회전
      #   중심에서 멀어(구동륜 축 기준 오프셋) 회전이 위치를 xy_goal_tolerance(0.1)의
      #   3배 넘게 망친다. 위치가 맞으면 방위가 틀리고 방위가 맞으면 위치가 벌어져
      #   goal checker 가 영원히 통과하지 못한다. 회전이 로봇을 책상 안으로 밀어넣어
      #   NavFn 까지 실패했다 ("failed to plan from (-45.13, 16.98)").
      #   through_pose_human_test.py 의 do_dock() docstring 에 적힌
      #   "위치를 맞춘 뒤 회전하면 그 회전이 위치를 망친다" 가 Nav2 쪽에서 재현된 것이다.
      # 대신 최종 정렬은 **MPPI 본체**가 한다 — 병진과 회전을 동시에 내므로 위치와 방위를
      #   같이 수렴시킬 수 있고 이 교착이 구조적으로 생기지 않는다.
      #   정렬 책임은 여전히 Nav2 다 (yaw_goal_tolerance 0.05 유지).
      #   방위가 잘 안 맞으면 GoalAngleCritic.cost_weight(3.0)를 올릴 것.
      rotate_to_goal_heading: false

      # --- 이하 primary_controller(MPPI) 파라미터. 같은 블록에 둔다 ---
      # --- 예측 지평 (Warthog 값 그대로) ---
      time_steps: 56            # x model_dt = 2.8초 예측
      model_dt: 0.05
      batch_size: 2000
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      regenerate_noises: true
      motion_model: "DiffDrive"
      # false -> true (2026-09-23). **끄면 RViz 에서 로컬 경로가 안 보인다.**
      # MPPI 는 DWB 와 달리 /local_plan 을 발행하지 않는다 (실측: Publisher count 0).
      # 대신 이 플래그가 켜져야 /transformed_global_plan(추종 중인 경로 구간)과
      # /trajectories(후보 궤적)를 낸다. RViz 에서 그 둘을 추가해야 보인다:
      #   Path        /transformed_global_plan   <- DWB 의 파란 local_plan 자리
      #   MarkerArray /trajectories              <- 후보 궤적 다발
      # 문서 경고: "Visualizing 2000 batches @ 56 points at 30 hz is *a lot*" —
      # 튜닝이 끝나면 false 로 되돌릴 것. (Warthog 출하 설정은 true 다)
      visualize: true

      # --- 속도/가감속. 현재 DWB 설정과 동일하게 맞춘 값들 ---
      # ★ MPPI 에는 DWB 의 forward_prune_distance / sim_time 결합이 없다.
      #   DWB 에서는 순항 속도가 2.0/1.7 = 1.18 m/s 로 간접 결정됐고 max_vel_x 1.5 는
      #   단순 상한이었다. MPPI 에서는 vx_max 가 그대로 순항 속도가 된다.
      #   그래서 1.5 가 아니라 **1.18** 을 넣는다 — 컨트롤러만 바꾸고 속도는 유지해야
      #   DWB 와 비교가 된다.
      vx_max: 1.18
      vx_min: -0.3              # = DWB min_vel_x. Clearpath 전 기종 vx_min -0.35 와 같은 취지
      vy_max: 0.0               # 차동구동. 횡방향 없음
      wz_max: 0.5               # = DWB max_vel_theta. 회전은 안 올린다
      # 가감속은 velocity_smoother 와 반드시 같아야 한다 (어긋나면 도킹 오버슈트).
      #   ax_max <-> velocity_smoother.max_accel[0]
      #   ax_min <-> velocity_smoother.max_decel[0]
      #   az_max <-> velocity_smoother.max_accel[2]
      ax_max: 2.0
      ax_min: -2.0
      az_max: 1.0
      # ★ 0.2 -> 0.45 (2026-09-23). **vx_max 를 올리면 이 값도 같이 올려야 한다.**
      # 실측: vx_max 1.18 인데 /cmd_vel_nav 가 0.486~0.492 에 붙어 있었다.
      # MPPI 는 직전 최적해 주변을 이 표준편차로 흩뿌려 탐색하므로, std 가 작으면
      # 1.18 근처를 아예 표집하지 못해 기본값 0.5 부근에 갇힌다.
      # Nav2 문서: "If you're not seeing your robot get to full speed, increase your std
      #             to explore more of the space." / "The faster the robot is set to go,
      #             the higher the velocity sampling standard deviations should be."
      # (이 문단은 ros-navigation/navigation2#4970 에서 메인테이너가 확인한 뒤 추가됐다)
      # 0.45 = Warthog 비율(0.2/0.5 = 0.4) x 1.18. 각속도가 떨리면 wz_std 를 먼저 내릴 것.
      vx_std: 0.45
      vy_std: 0.2
      wz_std: 0.4

      # --- 경로 핸들러 ---
      # 문서: prune_distance 는 최대 속도와 예측 지평에 비례해 잡고,
      # critic 이 보는 가장 먼 거리(여기선 threshold_to_consider 1.4) 이상이어야 한다.
      # 1.18 m/s x 2.8s = 3.30m 지평. 아래 threshold_to_consider(3.3) 이상이어야 해서 3.5.
      # (Warthog 는 0.5 m/s 기준 지평 1.4m, threshold 1.4, prune 1.7 로 같은 관계였다)
      prune_distance: 3.5
      transform_tolerance: 0.1

      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # ★ DWB 의 ObstacleFootprint.scale 0.05 해킹을 대체하는 항목이다.
        # base_link 가 풋프린트 중심이 아니라(x -1.38~0.48) 제자리 회전 스윕 반경이 1.468m 인데,
        # DWB 에서는 253 띠 감점이 회전을 체계적으로 억제해 scale 을 0.5 -> 0.2 -> 0.05 로
        # 계속 눌러야 했다. 여기서는 풋프린트째로 검사하므로 그 우회가 필요 없다.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        # 1.4 -> 3.3 (= 예측 지평 거리 vx_max 1.18 x 2.8s). Warthog 의 1.4 는 그쪽 지평
        # (0.5 x 2.8 = 1.4m)과 같은 값이었다 — 속도를 바꾸면 같이 움직여야 하는 값이다.
        # 문서: "Setting the threshold for consideration in the path follower + goal critics
        #        as the same as your prediction horizon can make sure you have clean
        #        hand-offs between them, as the path follower will otherwise attempt to
        #        slow slightly once it reaches the final goal pose as its marker."
        threshold_to_consider: 3.3
      GoalAngleCritic:
        # 목표 0.5m 안에서 최종 방위를 점수에 넣는다. 실제 제자리 회전은 RotationShim 의
        # rotate_to_goal_heading 이 xy 0.1m 안에서 받아 처리하고, 이 critic 은 그 앞
        # 접근 구간에서 방위를 미리 다듬어 회전량을 줄여준다.
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      # ★ 경로추종 계열 4개 값을 Warthog 값 -> **Nav2 기본값**으로 되돌렸다 (2026-09-23).
      # 증상: 전역 경로(빨간선)를 한 치도 안 벗어나고 정직하게 따라간다. NavFn 은 격자 A* 라
      #       경로가 계단형인데 그걸 그대로 훑으니 거동이 뻣뻣하고 코너도 안 다듬는다.
      # 원인: Warthog 는 야외 차량이라 **정확 추종**으로 튜닝된 출하 설정이다. 문서:
      #       "If you design exact-path-alignment behavior ... highly tuning the system to
      #        follow the path will give it less ability to deviate to avoid obstacles"
      #       "Not over-weighting the path align critic will allow the robot to deviate
      #        from the path to get around dynamic obstacles in the scene"
      #       "The defaults provided are in the generally right regime for a balanced
      #        initial trade-off."
      # 이 프로젝트는 **사람 회피**가 목적이라 경로 이탈 능력이 있어야 한다 -> 기본값이 맞다.
      # 되돌린 값: PathAlign.cost_weight 14->10, max_path_occupancy_ratio 0.05->0.07,
      #            PathFollow.offset_from_furthest 5->6,
      #            PathAngle.cost_weight 2.0->2.2, offset_from_furthest 4->20,
      #            max_angle_to_furthest 1.0->0.785398
      # 아직 뻣뻣하면 PathAlign.cost_weight 를 10 -> 6 으로 더 내릴 것 (여기부터 만질 것).
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 3.3   # GoalCritic 과 같은 값으로 (핸드오프 쌍)
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.2
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785398
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 책상까지 여유가 5cm 뿐이라 이 이상은 파지 자세가 충돌 판정된다
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      mark_threshold: 2
      always_send_full_costmap: False   # 240x240=57,600 셀 전체 대신 증분 발행. RViz 표시는 동일
      # StaticLayer 가 뒤에 오면 updateWithTrueOverwrite 로 팽창을 통째로 덮어씀 (실측: 팽창 cost 0개).
      # static 은 맨 앞, inflation 은 맨 뒤를 반드시 유지할 것.
      # front_3d_lidar_layer(VoxelLayer) -> stvl_layer + rear_scan_layer 로 분리했다.
      # STVL 저자가 "평면 라이다에는 쓰지 말라"고 명시해서 2D 인 /scan_rear 는 ObstacleLayer 로 남긴다.
      plugins: ["static_map_layer", "stvl_layer", "rear_scan_layer", "inflation_layer"]
      static_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        enabled: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0   # 거리에 따라 빠르게 감쇠 (붉은 띠 좁아짐)
        # 0.6 -> 1.55 (MPPI 전환에 동반). **이 값은 취향이 아니라 하한이 있다.**
        # CostCritic(consider_footprint: true) 은 "셀 비용 < 외접 반경 위치의 비용" 이면
        # 충돌 불가로 보고 SE2 풋프린트 검사를 건너뛴다. 그 임계값을 만들려면
        # inflation_radius >= 외접 반경이어야 한다. 작으면 조기 탈출이 통째로 꺼지고
        # 모든 궤적점을 풀 풋프린트로 검사한다 (실측 경고: computeCircumscribedCost).
        #
        #   외접 반경 = |(-1.38, 0.5) + footprint_padding 0.01| = sqrt(1.39^2 + 0.51^2)
        #             = 1.480608 m   <- Nav2 가 로그에 찍은 값과 일치
        #   1.55 = 1.4806 + 여유 0.07
        #
        # base_link 가 풋프린트 중심이 아니라 뒤 끝에서 1.38m 라 외접 반경이 이렇게 크다.
        # 1.0 으로 뒀다가 경고가 떠서 올렸다 (2026-09-23).
        #
        # 넓혀도 위험해지지 않는다: 253(내접) 띠는 inflation_radius 가 아니라 내접 반경
        # 0.51 이 정한다. 늘어나는 건 그 바깥의 완만한 경사뿐이고, CostCritic 의
        # 강한 감점(critical_cost 300)은 near_collision_cost 253 위에서만 걸린다.
        # Nav2 Tuning Guide 의 "smooth potential" 권고와도 같은 방향이다.
        # cost_scaling_factor 는 3.0 그대로 둔다 — 한 번에 하나씩.
        inflation_radius: 1.55
        
      # 주의: 아래 이름들은 nav2_costmap_2d::VoxelLayer 가 선언하는 이름과 정확히 일치해야 한다.
      # ros2 param list /local_costmap/local_costmap 로 확인 가능. 이름이 틀리면 조용히 무시된다.
      # 시간 감쇠 레이어. raytrace clearing 은 "지금 광선이 통과한 셀"만 지우므로,
      # 관측이 끊긴 자리(로봇 뒤로 빠진 곳, 사람에 가렸던 그림자)는 영원히 안 지워진다.
      # STVL 은 마킹에 수명을 줘서 광선이 안 지나가도 시간이 지나면 사라지게 한다.
      # 파라미터 이름이 VoxelLayer 와 다르다 (obstacle_max_range -> obstacle_range 등).
      # 값은 패키지가 제공하는 example/vlp16_config.yaml 을 기준으로 잡았다.
      # VLP16 이 +-15도 3D 라이다라 XT-32 (elevationDeg -15~+15) 와 사양이 같다.
      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 5.0             # 초. 관측이 끊긴 마킹이 5초 뒤 사라진다  <- 핵심 값
        decay_model: 0               # 0=선형, 1=지수, -1=영구
        voxel_size: 0.05
        track_unknown_space: true
        mark_threshold: 0
        update_footprint_enabled: true   # VoxelLayer 의 footprint_clearing_enabled 에 해당
        combination_method: 1        # 1=max
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        map_save_duration: 60.0
        # 같은 토픽을 마킹용과 클리어링용으로 두 벌 선언한다. STVL 의 구조다.
        observation_sources: front_mark front_clear
        front_mark:
          data_type: PointCloud2
          topic: /front_3d_lidar/lidar_points
          marking: true
          clearing: false
          obstacle_range: 6.0        # 기존 obstacle_max_range 6.0 과 같은 의도
          # 바닥 컷. nav2 ObservationBuffer 가 클라우드를 전역 프레임으로 변환한 뒤 넘기므로
          # 이 값은 바닥 기준 높이다.
          # 이전 VoxelLayer 도 -0.8 이었지만 바닥이 안 찍혔던 건 다른 두 장치 덕분이었다:
          #   (1) z_voxels 10 x z_resolution 0.2 -> 복셀 그리드가 z=0~2.0m 에만 존재
          #   (2) mark_threshold 2 -> 기둥에 복셀 2개(0.4m) 이상 있어야 장애물. 바닥은 한 층이라 탈락
          # STVL 은 OpenVDB 라 z 상한이 없고 mark_threshold 0 이라 둘 다 사라졌다 -> 바닥이 통째로 찍혔다.
          min_obstacle_height: 0.1   # -0.8 에서. 바닥면 위 10cm 부터만 장애물로 친다
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          filter: "voxel"            # vlp16 예제 기준. 3D 라이다는 점이 많아 voxel 필터 권장
          voxel_min_points: 0
          clear_after_reading: true
        front_clear:
          enabled: true
          data_type: PointCloud2
          topic: /front_3d_lidar/lidar_points
          marking: false
          clearing: true
          min_z: 0.1                 # front_mark 의 min_obstacle_height 와 맞출 것.
                                     # 어긋나면 바닥 근처에서 지우기/찍기가 불일치한다
          max_z: 6.0                 # obstacle_range 와 맞춤
          vertical_fov_angle: 0.5236 # XT-32 수직 FOV 30도 (robot_nova.usd 의 elevationDeg -15~+15 실측)
          vertical_fov_padding: 0.05 # 3D 라이다 전용
          horizontal_fov_angle: 6.2832  # 360도
          decay_acceleration: 5.0
          model_type: 1              # 1 = 3D 라이다 (모래시계형 FOV). 0 은 깊이 카메라

      # 후방 2D 라이다. STVL 이 평면 라이다를 지원하지 않아 ObstacleLayer 로 따로 둔다.
      # 설정은 기존 front_3d_lidar_layer 의 scan_rear 소스를 그대로 옮긴 것이다.
      rear_scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_sources: scan_rear
        scan_rear:
          data_type: LaserScan
          topic: /scan_rear
          marking: true
          clearing: true
          obstacle_max_range: 6.0    # 로컬은 12x12m 롤링 윈도우다
          obstacle_min_range: 0.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          min_obstacle_height: -0.8
          max_obstacle_height: 3.0
          expected_update_rate: 0.0
          observation_persistence: 0.0
          # pointcloud_to_laserscan 이 use_inf: True 라 미검출 광선은 inf 로 온다.
          # false 로 두면 그 광선을 버려 아무것도 지우지 않는다.
          inf_is_valid: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      footprint_padding: 0.01   # 〃
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[ [0.48, 0.5], [0.48, -0.5], [-1.38, -0.5], [-1.38, 0.5] ]"
      # rolling_window: True
      # width: 200
      # height: 200
      resolution: 0.05
      # origin_x: -100.0
      # origin_y: -100.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # 후방 2D 라이다가 자기 차체를 본다 (실측). 센서가 base_link 기준 x=-0.613 로 footprint
        # (x -1.38~0.48) 한가운데 있어서, 스캔에 footprint 경계까지의 거리가 그대로 찍힌다:
        #   뒤 모서리 0.916m / 앞 변 1.093m / 앞 모서리 1.202m  <- 실측 클러스터와 일치
        # ObstacleLayer 의 기본값은 false 라 이 점들이 영구 장애물로 남아 로봇을 따라다닌다.
        # local_costmap 의 VoxelLayer 는 이미 true 로 켜져 있었다.
        footprint_clearing_enabled: true
        # scan      = 전방. /front_3d_lidar/lidar_points 를 pointcloud_to_laserscan 이 변환
        # scan_rear = 후방 2D RPLidar(SLAMTEC S2E). Isaac 액션그래프가 LaserScan 을 직접 발행하므로
        #             변환 노드가 없다. 자세한 배선은 run_human_scene.py 의 ensure_rear_lidar_graph 참고.
        observation_sources: scan scan_rear
        scan:
          topic: /scan
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          # 찍는 건 5m 이내만, 지우는 건 20m 까지.
          # 전역 costmap 은 시간 감쇠가 없다(소스가 LaserScan 2개뿐이라 STVL 을 못 쓴다).
          # 그래서 한 번 찍힌 마킹은 광선이 그 셀을 다시 통과해야만 지워진다.
          # 사거리 20m 로 멀리까지 찍으면 로봇이 다시 볼 일 없는 곳에 잔상이 영구히 쌓인다.
          # raytrace_max_range 는 20m 로 남겨 지우는 능력은 그대로 둔다.
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
          # pointcloud_to_laserscan 이 use_inf: True 라 미검출 광선은 inf 로 온다.
          # nav2 ObstacleLayer 는 이 값에 따라 콜백이 갈린다:
          #   false -> inf 광선을 버린다. 아무것도 지우지 않는다
          #   true  -> inf 를 range_max - epsilon 으로 바꿔 raytrace_max_range 까지 비운다
          # "거기 아무것도 없다"는 가장 강한 정보를 false 로 두면 통째로 버리게 된다.
          # 사람이 지나간 자리가 안 지워지고 영구 장애물로 남던 원인.
          inf_is_valid: true
        scan_rear:
          topic: /scan_rear
          max_obstacle_height: 4.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          # RPLidar S2E 실측 사거리는 30m 지만, 전방 scan 과 같은 20m 로 맞춘다.
          # 마킹 범위보다 해제 범위가 작으면 마크가 안 지워진다.
          raytrace_max_range: 20.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0   # 위 scan 과 같은 이유
          obstacle_min_range: 0.0
          inf_is_valid: true        # 위 scan 과 같은 이유
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 전역만 키운다. local 의 0.6 은 DWB ObstacleFootprint 판정과 엮여 있고
        # "내접 반경 0.48m 안에 들면 제자리 회전까지 막혔다"는 실측 이력이 있어 건드리지 않는다.
        #
        # NavFn 은 비용 가중치 파라미터가 없다 (tolerance/use_astar/allow_unknown/
        # use_final_approach_orientation 뿐. COST_NEUTRAL 50, COST_FACTOR 0.8 은 컴파일 상수).
        # 따라서 경로를 장애물에서 밀어내는 수단은 costmap 비용 자체를 키우는 것뿐이다.
        #
        # 0.6 은 내접 반경 0.48 + 0.12 로 "겨우 안 닿는" 값이라, 사람에게서 0.6m 만 떨어져도
        # 비용이 0 이 되어 NavFn 이 그 경계에 딱 붙는다. 그런데 차체는 base_link 기준
        # 뒤로 1.38m / 앞으로 0.48m 라, 중심이 0.6m 떨어져도 차체는 사람 코앞이다.
        # 팽창 비용은 치명(254)이 아니라 선호도이므로 키워도 통행 불가가 되지는 않는다.
        cost_scaling_factor: 1.5   # 3.0 은 감쇠가 빨라 비용 띠가 좁았다. 낮추면 먼 거리까지 비용 유지
        inflation_radius: 1.2      # 0.6 -> 1.2. radius 와 scaling 은 같이 조절해야 의미가 있다
      always_send_full_costmap: False   # 1001x1001=100만 셀을 매초 직렬화하던 것을 증분으로. RViz 표시는 동일
  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

collision_monitor:
  ros__parameters:
    use_sim_time: True
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6000000000
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.3
      max_height: 4.0
      enabled: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "intergration_nova.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5000
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 10.0
    planner_plugins: ["GridBased"]
    GridBased:
      # 차동구동이라 제자리 회전이 가능한데, Smac Hybrid 는 곡률 제약(최소 회전반경) 때문에
      # 항상 큰 호로 돌고 가까운 목표에서 고리를 그리다 실패했다 -> 격자 A* 인 NavFn 으로 복귀.
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.10   # goal checker 의 xy_goal_tolerance(0.10) 와 일치. 0.05 로 내렸다가 같이 원복 (2026-09-23). 0.25 면 NavFn 이 목표에서 25cm 못 미쳐 끝내도 되는데 성공 판정은 10cm 라 영원히 도달 불가
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5   # 주행 max_vel_theta 와 일치 (복구가 더 거칠면 안 됨)
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0   # 주행 acc_lim_theta 와 일치

robot_state_publisher:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

